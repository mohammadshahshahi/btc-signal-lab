name: Historical BTCUSDT Paper Backtest

on:
  workflow_dispatch:
    inputs:
      start_utc:
        description: "Inclusive UTC candle boundary (ISO-8601, e.g. 2025-01-01T00:00:00Z)"
        required: true
        default: "2025-01-01T00:00:00Z"
        type: string
      end_utc:
        description: "Exclusive UTC candle boundary, aligned to interval"
        required: true
        default: "2025-02-01T00:00:00Z"
        type: string
      interval:
        description: "Binance Spot candle interval"
        required: true
        default: "1h"
        type: choice
        options:
          - 1h
          - 4h
          - 1d
      fee_rate:
        description: "Fee fraction per side (0.001 = 0.1%)"
        required: true
        default: "0.001"
        type: string
      slippage_bps:
        description: "Slippage basis points per side"
        required: true
        default: "5"
        type: string

permissions:
  contents: read

jobs:
  historical-paper-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Download, verify, and evaluate public historical candles
        env:
          START_UTC: ${{ inputs.start_utc }}
          END_UTC: ${{ inputs.end_utc }}
          INTERVAL: ${{ inputs.interval }}
          FEE_RATE: ${{ inputs.fee_rate }}
          SLIPPAGE_BPS: ${{ inputs.slippage_bps }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from btc_signal_lab.market_data import download_binance_klines, save_dataset
          from btc_signal_lab.evaluation import evaluate_dataset, write_report

          start = os.environ["START_UTC"]
          end = os.environ["END_UTC"]
          interval = os.environ["INTERVAL"]
          fee_rate = float(os.environ["FEE_RATE"])
          slippage_bps = float(os.environ["SLIPPAGE_BPS"])
          out = Path("backtest-artifacts")
          out.mkdir(parents=True, exist_ok=True)
          csv_path = out / f"BTCUSDT_{interval}.csv"

          rows = download_binance_klines("BTCUSDT", interval, start, end)
          manifest = save_dataset(
              rows, csv_path, symbol="BTCUSDT", interval=interval,
              start=start, end=end,
          )
          report = evaluate_dataset(
              csv_path, initial_capital=10000.0,
              fee_rate=fee_rate, slippage_bps=slippage_bps,
          )
          write_report(report, out / "report.json")
          summary = {
              "dataset_rows": manifest["row_count"],
              "dataset_sha256": manifest["csv_sha256"],
              "symbol": manifest["symbol"],
              "interval": manifest["interval"],
              "start_utc": manifest["start_utc"],
              "end_utc_exclusive": manifest["end_utc_exclusive"],
              "results": report["results"],
          }
          (out / "summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True, allow_nan=False))
          PY
      - name: Upload reproducibility bundle (dataset is not committed)
        uses: actions/upload-artifact@v4
        with:
          name: btcusdt-paper-backtest-${{ github.run_id }}
          path: backtest-artifacts/
          if-no-files-found: error
          retention-days: 30
