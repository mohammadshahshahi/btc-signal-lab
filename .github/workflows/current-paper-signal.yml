name: Current BTCUSDT Paper Signal

on:
  push:
    branches:
      - feat/current-paper-signal
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      interval:
        description: "Candle interval for the paper signal"
        required: true
        default: "1h"
        type: choice
        options:
          - 15m
          - 1h
          - 4h

permissions:
  contents: read

concurrency:
  group: current-btc-paper-signal
  cancel-in-progress: false

jobs:
  generate-current-signal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: python -m pip install -e .
      - name: Fetch fresh closed candles and generate paper signal
        env:
          INTERVAL: ${{ inputs.interval || '1h' }}
          CODE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from btc_signal_lab.live_market_data import fetch_latest_closed_klines
          from btc_signal_lab.signal_engine import generate_signal

          interval = os.environ["INTERVAL"]
          candles, provenance = fetch_latest_closed_klines(
              "BTCUSDT", interval, limit=120
          )
          signal = generate_signal(
              candles, symbol="BTCUSDT", timeframe=interval
          )
          signal["as_of_candle_open_utc"] = provenance["latest_closed_candle_open_utc"]
          signal["data_provenance"] = provenance
          signal["code_commit"] = os.environ["CODE_COMMIT"]
          signal["generated_at_utc"] = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")
          signal["execution_mode"] = "paper_only"
          signal["position_semantics"] = {
              "mode": "long_only_spot",
              "BUY": "open_long_if_flat",
              "SELL": "close_long_if_open",
              "HOLD": "no_action",
              "short_positions_supported": False,
          }
          signal["live_orders_submitted"] = 0

          output = Path("current-signal-artifact")
          output.mkdir(parents=True, exist_ok=True)
          (output / "signal.json").write_text(
              json.dumps(signal, indent=2, sort_keys=True, allow_nan=False) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(signal, indent=2, sort_keys=True, allow_nan=False))
          PY
      - name: Upload signal and source evidence
        uses: actions/upload-artifact@v4
        with:
          name: current-btcusdt-paper-signal-${{ github.run_id }}
          path: current-signal-artifact/signal.json
          if-no-files-found: error
          retention-days: 14
